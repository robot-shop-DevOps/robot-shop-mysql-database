name: Build and Deploy mysql database to Development

on:
  push:
    branches-ignore:
      - main   

  pull_request:
    branches:
      - develop

  workflow_dispatch:

jobs:
  deploy:
    uses: robot-shop-DevOps/robot-shop-github-actions/.github/workflows/databases.yaml@main
    with:
      IMAGE: mysql
      NAMESPACE: mysql-database
      RELEASE: mysql
      DOCKERFILE_PATH: ./mysql
      IMAGE_OVERRIDE_PATHS: "statefulset.pod.containers[0].image job.create_users.pod.containers[0].image job.insert_data.pod.containers[0].image"
    secrets: inherit